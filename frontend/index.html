<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Fraunces", "Georgia", "serif"],
              sans: ["Outfit", "system-ui", "sans-serif"],
            },
            colors: {
              ink: {
                950: "#0f1412",
                900: "#1a2420",
                800: "#2a3832",
                700: "#3d4f47",
                500: "#6b7f75",
                400: "#8a9b93",
                300: "#b0bdb6",
                200: "#d4ddd8",
                100: "#e8eeeb",
                50: "#f3f6f4",
              },
              celadon: {
                700: "#2d5a4a",
                600: "#3a7360",
                500: "#4a8f76",
                400: "#6aad92",
                100: "#dceee6",
                50: "#eef7f2",
              },
              coral: {
                700: "#9a3b32",
                600: "#c24b3f",
                500: "#d96054",
                100: "#fce8e6",
                50: "#fdf4f3",
              },
              mist: {
                100: "#e6ebe8",
                50: "#f0f4f1",
                25: "#f7f9f8",
              },
            },
            boxShadow: {
              soft: "0 1px 2px rgba(15, 20, 18, 0.04), 0 8px 24px rgba(15, 20, 18, 0.06)",
              lift: "0 12px 40px rgba(15, 20, 18, 0.1)",
            },
            keyframes: {
              fadeUp: {
                "0%": { opacity: "0", transform: "translateY(12px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              growX: {
                "0%": { transform: "scaleX(0)" },
                "100%": { transform: "scaleX(1)" },
              },
              spinSlow: {
                to: { transform: "rotate(360deg)" },
              },
            },
            animation: {
              "fade-up": "fadeUp 0.55s ease-out both",
              "fade-in": "fadeIn 0.4s ease-out both",
              "grow-x": "growX 0.7s cubic-bezier(0.22, 1, 0.36, 1) both",
              "spin-slow": "spinSlow 0.8s linear infinite",
            },
          },
        },
      };
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
