name: Deploy Atlas to Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy app
        env:
          APP_LOGIN_KEY: ${{ secrets.APP_LOGIN_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          if [ -z "$APP_LOGIN_KEY" ]; then
            echo "Add APP_LOGIN_KEY as a GitHub Actions secret." >&2
            exit 1
          fi
          gcloud run deploy atlas \
            --source . \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --max 1 \
            --allow-unauthenticated \
            --update-env-vars "APP_LOGIN_KEY=$APP_LOGIN_KEY,PORTFOLIO_DB_PATH=/tmp/portfolio.db"
